services:
  app:
    volumes:
      - ./server:/app/server
      - ./data:/app/data
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
    command: npx nodemon --ignore data/ server/index.js
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3088/api/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
